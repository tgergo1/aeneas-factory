<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-labelledby="t d">
  <title id="t">Aeneas Factory: how the tools and models fit together</title>
  <desc id="d">Three generators run locally on Apple Silicon. ai-image turns a text prompt, a reference image or a photo into a PNG with Z-Image Turbo or FLUX.2 klein through stable-diffusion.cpp. ai-3d turns one image into a textured GLB with TRELLIS.2 through trellis.cpp. ai-sfx turns a description into a WAV with MOSS-SoundEffect through MLX. Every output gets a JSON sidecar with models, licences, prompt, seed, settings, checksums and the exact command. Below: make install, the ai-models register, the ai-check health check and AGENTS.md for AI agents.</desc>
  <style>
    .card { fill: #f8fafc; stroke: #e2e8f0; }
    .box { fill: #ffffff; stroke: #cbd5e1; }
    .txt { fill: #0f172a; }
    .mut { fill: #475569; }
    .faint { fill: #64748b; }
    .line { stroke: #94a3b8; }
    .arrow { fill: #94a3b8; }
    .img { fill: #1d4ed8; } .img-s { stroke: #2563eb; } .img-t { fill: #dbeafe; }
    .geo { fill: #c2410c; } .geo-s { stroke: #ea580c; } .geo-t { fill: #ffedd5; }
    .snd { fill: #0f766e; } .snd-s { stroke: #0d9488; } .snd-t { fill: #ccfbf1; }
    .prv { fill: #6d28d9; } .prv-s { stroke: #7c3aed; } .prv-t { fill: #ede9fe; }
    .pill { fill: #f8fafc; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .box { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; }
      .mut { fill: #9da7b3; }
      .faint { fill: #7d8590; }
      .line { stroke: #57606a; }
      .arrow { fill: #57606a; }
      .img { fill: #79b8ff; } .img-s { stroke: #58a6ff; } .img-t { fill: #0c2d6b; }
      .geo { fill: #ffa657; } .geo-s { stroke: #f0883e; } .geo-t { fill: #3d1e0a; }
      .snd { fill: #56d4c1; } .snd-s { stroke: #39c5b0; } .snd-t { fill: #06302b; }
      .prv { fill: #c4a7ff; } .prv-s { stroke: #a371f7; } .prv-t { fill: #271452; }
      .pill { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="1199" height="789" rx="18" stroke-width="1"/>

  <!-- Title -->
  <text class="txt" x="40" y="54" font-size="28" font-weight="700">Aeneas Factory</text>
  <text class="mut" x="40" y="82" font-size="14.5">Images, 3D models and sound effects from open models, offline on Apple Silicon. Every output carries its own provenance record.</text>

  <!-- Column headings -->
  <g class="faint" font-size="11.5" font-weight="600" letter-spacing="1.2">
    <text x="40" y="124">INPUT</text>
    <text x="270" y="124">COMMAND · MODEL · ENGINE</text>
    <text x="790" y="124">OUTPUT</text>
    <text x="990" y="124">PROVENANCE</text>
  </g>

  <!-- Lane 1: image -->
  <rect class="box img-s" x="40" y="165" width="190" height="100" rx="12" stroke-width="1.5"/>
  <text class="txt" x="58" y="196" font-size="15.5" font-weight="650">Text prompt</text>
  <text class="mut" x="58" y="220" font-size="12.5">+ a reference image to edit</text>
  <text class="mut" x="58" y="240" font-size="12.5">+ a photo to restyle or tile</text>

  <rect class="box img-s" x="270" y="140" width="480" height="150" rx="14" stroke-width="1.5"/>
  <text class="img mono" x="290" y="172" font-size="19" font-weight="700">ai-image</text>
  <text class="mut" x="730" y="171" font-size="12" text-anchor="end">stable-diffusion.cpp · Metal</text>
  <rect class="img-t" x="290" y="187" width="440" height="40" rx="8"/>
  <text class="txt" x="305" y="212" font-size="14" font-weight="650">Z-Image Turbo</text>
  <text class="mut" x="715" y="212" font-size="12" text-anchor="end">8 steps · 11.2 GB · Apache-2.0</text>
  <rect class="img-t" x="290" y="235" width="440" height="40" rx="8"/>
  <text class="txt" x="305" y="260" font-size="14" font-weight="650">FLUX.2 [klein] 4B</text>
  <text class="mut" x="715" y="260" font-size="12" text-anchor="end">4 steps · edits · 4.5 GB · Apache-2.0</text>

  <rect class="box img-s" x="790" y="165" width="160" height="100" rx="12" stroke-width="1.5"/>
  <text class="img mono" x="808" y="200" font-size="22" font-weight="700">.png</text>
  <text class="mut" x="808" y="224" font-size="12.5">text to image</text>
  <text class="mut" x="808" y="243" font-size="12.5">edits · seamless tiles</text>

  <!-- Lane 2: 3D -->
  <rect class="box geo-s" x="40" y="320" width="190" height="90" rx="12" stroke-width="1.5"/>
  <text class="txt" x="58" y="352" font-size="15.5" font-weight="650">One image</text>
  <text class="mut" x="58" y="376" font-size="12.5">one object, plain or</text>
  <text class="mut" x="58" y="394" font-size="12.5">transparent background</text>

  <rect class="box geo-s" x="270" y="310" width="480" height="110" rx="14" stroke-width="1.5"/>
  <text class="geo mono" x="290" y="342" font-size="19" font-weight="700">ai-3d</text>
  <text class="mut" x="730" y="341" font-size="12" text-anchor="end">trellis.cpp · Metal</text>
  <rect class="geo-t" x="290" y="357" width="440" height="44" rx="8"/>
  <text class="txt" x="305" y="384" font-size="14" font-weight="650">TRELLIS.2 4B</text>
  <text class="mut" x="715" y="384" font-size="12" text-anchor="end">DINOv3 · BiRefNet matting · 16.5 GB · MIT*</text>

  <rect class="box geo-s" x="790" y="320" width="160" height="90" rx="12" stroke-width="1.5"/>
  <text class="geo mono" x="808" y="355" font-size="22" font-weight="700">.glb</text>
  <text class="mut" x="808" y="379" font-size="12.5">UV-unwrapped mesh</text>
  <text class="mut" x="808" y="397" font-size="12.5">PBR texture atlas</text>

  <!-- Lane 3: sound -->
  <rect class="box snd-s" x="40" y="450" width="190" height="90" rx="12" stroke-width="1.5"/>
  <text class="txt" x="58" y="482" font-size="15.5" font-weight="650">A description</text>
  <text class="mut" x="58" y="506" font-size="12.5">“an old door creaks</text>
  <text class="mut" x="58" y="524" font-size="12.5">open slowly”</text>

  <rect class="box snd-s" x="270" y="440" width="480" height="110" rx="14" stroke-width="1.5"/>
  <text class="snd mono" x="290" y="472" font-size="19" font-weight="700">ai-sfx</text>
  <text class="mut" x="730" y="471" font-size="12" text-anchor="end">MLX · Apple Silicon GPU</text>
  <rect class="snd-t" x="290" y="487" width="440" height="44" rx="8"/>
  <text class="txt" x="305" y="514" font-size="14" font-weight="650">MOSS-SoundEffect v2.0</text>
  <text class="mut" x="715" y="514" font-size="12" text-anchor="end">48 kHz · ≤ 30 s · 8.4 GB · Apache-2.0</text>

  <rect class="box snd-s" x="790" y="450" width="160" height="90" rx="12" stroke-width="1.5"/>
  <text class="snd mono" x="808" y="485" font-size="22" font-weight="700">.wav</text>
  <text class="mut" x="808" y="509" font-size="12.5">foley · ambience</text>
  <text class="mut" x="808" y="527" font-size="12.5">creatures · action</text>

  <!-- Flow arrows -->
  <g class="line" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M230,215 H266"/>
    <path d="M750,215 H786"/>
    <path d="M230,365 H266"/>
    <path d="M750,365 H786"/>
    <path d="M230,495 H266"/>
    <path d="M750,495 H786"/>
    <path d="M950,215 H986"/>
    <path d="M950,365 H986"/>
    <path d="M950,495 H986"/>
  </g>
  <!-- Chaining: image to 3D -->
  <path class="geo-s" d="M870,265 V299 H135 V316" fill="none" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect class="pill" x="436" y="289" width="128" height="20" rx="10"/>
  <text class="geo" x="500" y="303" font-size="12" font-weight="600" text-anchor="middle">chain: image → 3D</text>

  <!-- Provenance -->
  <rect class="box prv-s" x="990" y="140" width="170" height="410" rx="14" stroke-width="1.5"/>
  <text class="prv mono" x="1008" y="172" font-size="14.5" font-weight="700">+ .json sidecar</text>
  <text class="mut" x="1008" y="193" font-size="12">next to every output</text>
  <g font-size="12.5">
    <circle class="prv" cx="1012" cy="227" r="3"/><text class="txt" x="1022" y="231">models, licences</text>
    <circle class="prv" cx="1012" cy="257" r="3"/><text class="txt" x="1022" y="261">commercial use</text>
    <circle class="prv" cx="1012" cy="287" r="3"/><text class="txt" x="1022" y="291">prompt, seed</text>
    <circle class="prv" cx="1012" cy="317" r="3"/><text class="txt" x="1022" y="321">every setting</text>
    <circle class="prv" cx="1012" cy="347" r="3"/><text class="txt" x="1022" y="351">input SHA-256</text>
    <circle class="prv" cx="1012" cy="377" r="3"/><text class="txt" x="1022" y="381">output SHA-256</text>
    <circle class="prv" cx="1012" cy="407" r="3"/><text class="txt" x="1022" y="411">the exact command</text>
    <circle class="prv" cx="1012" cy="437" r="3"/><text class="txt" x="1022" y="441">when, how long</text>
  </g>
  <rect class="prv-t" x="1004" y="470" width="142" height="62" rx="8"/>
  <text class="txt" x="1075" y="495" font-size="12" font-weight="600" text-anchor="middle">enough to credit,</text>
  <text class="txt" x="1075" y="513" font-size="12" font-weight="600" text-anchor="middle">disclose, and remake</text>

  <!-- Bottom band -->
  <text class="faint" x="40" y="590" font-size="11.5" font-weight="600" letter-spacing="1.2">SET UP · KEEP HEALTHY · WORK WITH AGENTS</text>
  <g>
    <rect class="box" x="40" y="604" width="265" height="140" rx="12" stroke-width="1"/>
    <text class="txt mono" x="58" y="634" font-size="15.5" font-weight="700">make install</text>
    <text class="mut" x="58" y="660" font-size="12.5">builds the tools at pinned commits</text>
    <text class="mut" x="58" y="680" font-size="12.5">downloads 40.5 GB of models</text>
    <text class="mut" x="58" y="700" font-size="12.5">pinned, SHA-256 checked</text>
    <text class="mut" x="58" y="720" font-size="12.5">resumable; or one group at a time</text>

    <rect class="box" x="325" y="604" width="265" height="140" rx="12" stroke-width="1"/>
    <text class="txt mono" x="343" y="634" font-size="15.5" font-weight="700">bin/ai-models</text>
    <text class="mut" x="343" y="660" font-size="12.5">the register: models.json</text>
    <text class="mut" x="343" y="680" font-size="12.5">list · find · show</text>
    <text class="mut" x="343" y="700" font-size="12.5">download all | image | 3d | sound</text>
    <text class="mut" x="343" y="720" font-size="12.5">verify --full</text>

    <rect class="box" x="610" y="604" width="265" height="140" rx="12" stroke-width="1"/>
    <text class="txt mono" x="628" y="634" font-size="15.5" font-weight="700">bin/ai-check</text>
    <text class="mut" x="628" y="660" font-size="12.5">platform, tools, every model file</text>
    <text class="mut" x="628" y="680" font-size="12.5">a tiny job through each generator</text>
    <text class="mut" x="628" y="700" font-size="12.5">about 7 minutes; --quick in seconds</text>
    <text class="mut" x="628" y="720" font-size="12.5">run after macOS or Homebrew updates</text>

    <rect class="box" x="895" y="604" width="265" height="140" rx="12" stroke-width="1"/>
    <text class="txt mono" x="913" y="634" font-size="15.5" font-weight="700">AGENTS.md</text>
    <text class="mut" x="913" y="660" font-size="12.5">for Claude Code, Codex and others</text>
    <text class="mut" x="913" y="680" font-size="12.5">Blender · GIMP · ffmpeg</text>
    <text class="mut" x="913" y="700" font-size="12.5">free libraries: Poly Haven, Kenney, …</text>
    <text class="mut" x="913" y="720" font-size="12.5">record every source and licence</text>
  </g>

  <text class="faint" x="40" y="772" font-size="11.5">Tested on macOS 27 · Apple M5 Pro, 64 GB · 2026-10-14.   * TRELLIS.2 and BiRefNet are MIT; dinov3.gguf is under Meta's DINOv3 License.</text>
</svg>
