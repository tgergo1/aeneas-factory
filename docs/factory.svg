<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
  <title id="t">Aeneas Factory: how it fits together</title>
  <desc id="d">Agents reach the factory through its MCP server, scripts through the aen command line, people through ComfyUI and Blender. All work goes through one factory service on 127.0.0.1 with a single job queue. Every job passes through the licence policy, an engine, automatic checks, optional ranking of candidates, provenance written into and beside the file, and the asset library. Engines: stable-diffusion.cpp for Z-Image Turbo and FLUX.2 klein, trellis.cpp for TRELLIS.2, MLX for MOSS-SoundEffect and Kokoro speech, rembg with BiRefNet, Real-ESRGAN, ComfyUI, Blender and ffmpeg. Recipes, style packs and the model register feed the service.</desc>
  <style>
    .card { fill: #f8fafc; stroke: #e2e8f0; }
    .box { fill: #ffffff; stroke: #cbd5e1; }
    .txt { fill: #0f172a; } .mut { fill: #475569; } .faint { fill: #64748b; }
    .line { stroke: #94a3b8; } .arrow { fill: #94a3b8; }
    .img { fill: #1d4ed8; } .img-s { stroke: #2563eb; } .img-t { fill: #dbeafe; }
    .geo { fill: #c2410c; } .geo-s { stroke: #ea580c; } .geo-t { fill: #ffedd5; }
    .snd { fill: #0f766e; } .snd-s { stroke: #0d9488; } .snd-t { fill: #ccfbf1; }
    .prv { fill: #6d28d9; } .prv-s { stroke: #7c3aed; } .prv-t { fill: #ede9fe; }
    .core-t { fill: #f1f5f9; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; } .box { fill: #161b22; stroke: #30363d; }
      .txt { fill: #e6edf3; } .mut { fill: #9da7b3; } .faint { fill: #7d8590; }
      .line { stroke: #57606a; } .arrow { fill: #57606a; }
      .img { fill: #79b8ff; } .img-s { stroke: #58a6ff; } .img-t { fill: #0c2d6b; }
      .geo { fill: #ffa657; } .geo-s { stroke: #f0883e; } .geo-t { fill: #3d1e0a; }
      .snd { fill: #56d4c1; } .snd-s { stroke: #39c5b0; } .snd-t { fill: #06302b; }
      .prv { fill: #c4a7ff; } .prv-s { stroke: #a371f7; } .prv-t { fill: #271452; }
      .core-t { fill: #1c2128; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1199" height="859" rx="18"/>

  <text class="txt" x="40" y="54" font-size="28" font-weight="700">Aeneas Factory</text>
  <text class="mut" x="40" y="82" font-size="14.5">Local generation of images, textures, 3D models, sound and speech, with checks, provenance and licence policy built in.</text>

  <!-- Row 1: ways in -->
  <text class="faint" x="40" y="124" font-size="11.5" font-weight="600" letter-spacing="1.2">WAYS IN</text>
  <g>
    <rect class="box prv-s" x="40" y="136" width="350" height="78" rx="12" stroke-width="1.5"/>
    <text class="prv mono" x="58" y="164" font-size="16" font-weight="700">MCP server</text>
    <text class="mut" x="58" y="186" font-size="12.5">Claude Code, Codex: 16 tools, thumbnails</text>
    <text class="mut" x="58" y="203" font-size="12.5">for every result, job ids for long work</text>
    <rect class="box" x="425" y="136" width="350" height="78" rx="12"/>
    <text class="txt mono" x="443" y="164" font-size="16" font-weight="700">aen  (and ai-*)</text>
    <text class="mut" x="443" y="186" font-size="12.5">command line for scripts and people;</text>
    <text class="mut" x="443" y="203" font-size="12.5">uses the service when it is running</text>
    <rect class="box" x="810" y="136" width="350" height="78" rx="12"/>
    <text class="txt mono" x="828" y="164" font-size="16" font-weight="700">ComfyUI · Blender</text>
    <text class="mut" x="828" y="186" font-size="12.5">for people: explore in ComfyUI on the</text>
    <text class="mut" x="828" y="203" font-size="12.5">same model files; Blender MCP for scenes</text>
  </g>
  <g class="line" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M215,214 V246"/><path d="M600,214 V246"/><path d="M985,214 V246"/>
  </g>

  <!-- Row 2: the service -->
  <rect class="box" x="40" y="250" width="1120" height="230" rx="14" stroke-width="1.5"/>
  <text class="txt mono" x="60" y="282" font-size="17" font-weight="700">factory service</text>
  <text class="mut" x="225" y="281" font-size="12.5">127.0.0.1 only · token · one GPU job at a time · sound model kept loaded · cancellable</text>
  <g font-size="12.5">
    <rect class="core-t" x="60" y="300" width="160" height="76" rx="9"/>
    <text class="txt" x="74" y="324" font-weight="650">1 · licence policy</text>
    <text class="mut" x="74" y="344">per project: allowed</text>
    <text class="mut" x="74" y="361">licences and models</text>
    <rect class="core-t" x="235" y="300" width="160" height="76" rx="9"/>
    <text class="txt" x="249" y="324" font-weight="650">2 · engine</text>
    <text class="mut" x="249" y="344">see below; style</text>
    <text class="mut" x="249" y="361">pack applied first</text>
    <rect class="core-t" x="410" y="300" width="160" height="76" rx="9"/>
    <text class="txt" x="424" y="324" font-weight="650">3 · checks</text>
    <text class="mut" x="424" y="344">no blank images, silent</text>
    <text class="mut" x="424" y="361">sound or empty meshes</text>
    <rect class="core-t" x="585" y="300" width="160" height="76" rx="9"/>
    <text class="txt" x="599" y="324" font-weight="650">4 · candidates</text>
    <text class="mut" x="599" y="344">make several, rank by</text>
    <text class="mut" x="599" y="361">SigLIP / CLAP, keep best</text>
    <rect class="prv-t" x="760" y="300" width="185" height="76" rx="9"/>
    <text class="txt" x="774" y="324" font-weight="650">5 · provenance</text>
    <text class="mut" x="774" y="344">in the file and beside it:</text>
    <text class="mut" x="774" y="361">models, versions, seeds</text>
    <rect class="core-t" x="960" y="300" width="180" height="76" rx="9"/>
    <text class="txt" x="974" y="324" font-weight="650">6 · asset library</text>
    <text class="mut" x="974" y="344">search by words or meaning;</text>
    <text class="mut" x="974" y="361">credits page per project</text>
  </g>
  <g class="line" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M220,338 H231"/><path d="M395,338 H406"/><path d="M570,338 H581"/><path d="M745,338 H756"/><path d="M945,338 H956"/>
  </g>
  <g font-size="12.5">
    <text class="faint" x="60" y="410" font-weight="600" letter-spacing="1">FED BY</text>
    <text class="txt mono" x="60" y="436" font-weight="700">recipes/</text>
    <text class="mut" x="60" y="456">prop · texture · sfx · sprite: several steps, one manifest</text>
    <text class="txt mono" x="460" y="436" font-weight="700">styles/</text>
    <text class="mut" x="460" y="456">prompt, references, LoRAs, palette per project</text>
    <text class="txt mono" x="820" y="436" font-weight="700">models.json</text>
    <text class="mut" x="820" y="456">pinned URLs, SHA-256, licences</text>
  </g>

  <g class="line" stroke-width="1.6" fill="none" marker-end="url(#a)"><path d="M600,480 V512"/></g>

  <!-- Row 3: engines -->
  <text class="faint" x="40" y="508" font-size="11.5" font-weight="600" letter-spacing="1.2">ENGINES AND MODELS</text>
  <g font-size="12.5">
    <rect class="box img-s" x="40" y="520" width="265" height="150" rx="12" stroke-width="1.5"/>
    <text class="img mono" x="58" y="548" font-size="15.5" font-weight="700">images</text>
    <text class="mut" x="58" y="568">stable-diffusion.cpp · Metal</text>
    <rect class="img-t" x="54" y="578" width="237" height="26" rx="6"/>
    <text class="txt" x="64" y="596">Z-Image Turbo · 11.2 GB</text>
    <rect class="img-t" x="54" y="608" width="237" height="26" rx="6"/>
    <text class="txt" x="64" y="626">FLUX.2 [klein] 4B · 4.5 GB</text>
    <text class="mut" x="58" y="656">+ Real-ESRGAN, BiRefNet, ComfyUI</text>

    <rect class="box geo-s" x="325" y="520" width="265" height="150" rx="12" stroke-width="1.5"/>
    <text class="geo mono" x="343" y="548" font-size="15.5" font-weight="700">3D</text>
    <text class="mut" x="343" y="568">trellis.cpp · Metal</text>
    <rect class="geo-t" x="339" y="578" width="237" height="26" rx="6"/>
    <text class="txt" x="349" y="596">TRELLIS.2 4B · 16.5 GB</text>
    <text class="mut" x="343" y="626">512: ~5 min · 1024: ~24 min</text>
    <text class="mut" x="343" y="656">+ Blender: size, origin, LODs</text>

    <rect class="box snd-s" x="610" y="520" width="265" height="150" rx="12" stroke-width="1.5"/>
    <text class="snd mono" x="628" y="548" font-size="15.5" font-weight="700">sound and speech</text>
    <text class="mut" x="628" y="568">MLX · Apple Silicon GPU</text>
    <rect class="snd-t" x="624" y="578" width="237" height="26" rx="6"/>
    <text class="txt" x="634" y="596">MOSS-SoundEffect · 8.4 GB</text>
    <rect class="snd-t" x="624" y="608" width="237" height="26" rx="6"/>
    <text class="txt" x="634" y="626">Kokoro 82M · 330 MB</text>
    <text class="mut" x="628" y="656">+ ffmpeg: trim, -18 LUFS</text>

    <rect class="box" x="895" y="520" width="265" height="150" rx="12"/>
    <text class="txt mono" x="913" y="548" font-size="15.5" font-weight="700">outputs</text>
    <text class="mut" x="913" y="572">.png  images, tiles + PBR maps</text>
    <text class="mut" x="913" y="594">.glb  models + LODs + preview</text>
    <text class="mut" x="913" y="616">.wav  effects, speech + waveform</text>
    <text class="prv" x="913" y="644" font-weight="650">each with its provenance</text>
  </g>

  <!-- Bottom band -->
  <text class="faint" x="40" y="708" font-size="11.5" font-weight="600" letter-spacing="1.2">SET UP · KEEP HEALTHY</text>
  <g font-size="12.5">
    <rect class="box" x="40" y="720" width="355" height="96" rx="12"/>
    <text class="txt mono" x="58" y="748" font-size="14.5" font-weight="700">make install GROUPS=image</text>
    <text class="mut" x="58" y="772">tools at pinned commits, models pinned and</text>
    <text class="mut" x="58" y="790">SHA-256 checked; all four core models 40.5 GB</text>
    <rect class="box" x="422" y="720" width="355" height="96" rx="12"/>
    <text class="txt mono" x="440" y="748" font-size="14.5" font-weight="700">aen check · make test · CI</text>
    <text class="mut" x="440" y="772">a real job through every generator; 38 tests;</text>
    <text class="mut" x="440" y="790">weekly check that every pinned download answers</text>
    <rect class="box" x="805" y="720" width="355" height="96" rx="12"/>
    <text class="txt mono" x="823" y="748" font-size="14.5" font-weight="700">AGENTS.md</text>
    <text class="mut" x="823" y="772">how agents should use it, plus Blender, GIMP</text>
    <text class="mut" x="823" y="790">and free asset libraries, with licence rules</text>
  </g>
  <text class="faint" x="40" y="842" font-size="11.5">Tested on macOS 27 · Apple M5 Pro, 64 GB · 2026-10-15. 3D: Built with DINOv3 (Meta's DINOv3 License; download needs ACCEPT=dinov3).</text>
</svg>
