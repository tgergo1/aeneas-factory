# Release the editor extension from the owner's self-hosted Linux runner: push a tag vscode-v<version>
# (matching editors/vscode/package.json). Always: a GitHub release with the .vsix (one package for every OS).
# With the secrets VSCE_PAT and OVSX_PAT: the VS Code Marketplace and Open VSX too (skipped without them).
# Needs the GitHub CLI (gh) on the runner. Tags need write access, so forks cannot start this.
name: Release VS Code extension

on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
      - name: The tag matches package.json
        run: |
          want="vscode-v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "tag $GITHUB_REF_NAME does not match $want"; exit 1; }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.test.json && npm run test:unit
      - name: Package
        run: |
          npm run package
          mv aeneas-factory.vsix "aeneas-factory-${GITHUB_REF_NAME#vscode-v}.vsix"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "the GitHub CLI (gh) is needed on the runner"; exit 1; }
          v="${GITHUB_REF_NAME#vscode-v}"
          gh release create "$GITHUB_REF_NAME" "aeneas-factory-$v.vsix" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "VS Code extension $v" \
            --notes "Aeneas Factory for VS Code, Cursor, Windsurf and VSCodium, version $v (preview), for macOS, Linux and Windows. Needs Aeneas Factory 0.5 or later.

          Install: download aeneas-factory-$v.vsix, then in the editor run **Extensions: Install from VSIX…**, or: \`code --install-extension aeneas-factory-$v.vsix\`. See [editors/vscode/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/editors/vscode/README.md)."
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT is not set: not published to the VS Code Marketplace"; exit 0; fi
          npx vsce publish --packagePath "aeneas-factory-${GITHUB_REF_NAME#vscode-v}.vsix"
      - name: Open VSX (Cursor, Windsurf, VSCodium)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT is not set: not published to Open VSX"; exit 0; fi
          npx ovsx publish --packagePath "aeneas-factory-${GITHUB_REF_NAME#vscode-v}.vsix"
